<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CAT / HOUR</title>
    <meta charset="UTF-8" />
    <meta property="og:title" content="CAT / HOUR" />
    <meta property="og:url" content="https://notneelpatel.github.io/cat-hour" />
    <meta property="og:image" content="https://notneelpatel.github.io/cat-hour/assets/og_image.jpg" />
    <meta name="og:image" content="https://notneelpatel.github.io/cat-hour/assets/og_image.jpg" />
    <meta property="og:description" content="9 random cat images per hour" />
    <meta property="og:type" content="website" /> 
    <link rel="stylesheet" href="./assets/style.css" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <main>
      
      <div id="container">
        <div id="image-container" data-entries-container>
          <template data-template>
            <div class="window-container" data-container>
              <div class="window-border">
                <div class="window-title-bar">
                  <span class = "window-title">CAT / HOUR</span>
                  <div class="window-controls">
                    <button type="button" class="window-control-button" id="window-minmax">_</button>
                    <button type="button" class="window-control-button" id="window-minmax"><strong>&square;</strong></button>
                    <button type="button" class="window-control-button" id="window-close">x</button>
                  </div>
                </div>
                <div class="window-content">
                  <div class="post-wrapper">
                    <img class="cat-img" href="#" data-img/>
                    <div class="caption">
                      <p data-caption></p>
                    </div>
                    <a class="url" href="#" data-url>source</a>
                  </div>
                </div>
              </div>
            </div>
    
          </template>
        </div>
      </div>
    </main>

      <footer>        
      <script src="./scripts/oneko.js" defer></script>
      <script src="./scripts/cathour.js" defer></script>
      <script src="./scripts/window.js"></script>

      <p>2025 <a href="https://notneelpatel.github.io">Neel Patel</a></p>
      <p>Images get updated as more submissions are posted</p>
      <p>all images and captions taken from <a href="https://www.reddit.com">reddit.com</a></p>
      <p><a href="https://github.com/notneelpatel/cat-hour">GitHub Repo</a></p>
    </footer>
  </body>
</html>
